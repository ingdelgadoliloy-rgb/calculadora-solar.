# Genera el APK de Android en cada cambio. Descárgalo en la pestaña
# Actions → la ejecución más reciente → Artifacts → "calculadora-solar-apk".
# Si creas una etiqueta v1.0.0 (o similar), además publica el APK en Releases.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android, íconos y permisos
        run: npm run android:init

      - name: Número de versión
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar APK de prueba (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar y firmar APK de publicación (si hay llave)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out app/build/outputs/apk/release/calculadora-solar.apk app-release-aligned.apk
          rm release.jks

      - name: Reunir APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/calculadora-solar-debug.apk
          if [ -f android/app/build/outputs/apk/release/calculadora-solar.apk ]; then cp android/app/build/outputs/apk/release/calculadora-solar.apk dist/; fi

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # si se llena la cuota de artefactos, el APK igual queda en Releases
        with:
          name: calculadora-solar-apk
          path: dist/*.apk
          retention-days: 7

      - name: Publicar la última versión en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima dist/*.apk --target "$GITHUB_SHA" --prerelease \
            --title "Última versión (1.0.${{ github.run_number }})" \
            --notes "APK generado automáticamente desde main. Instala calculadora-solar-debug.apk en tu Android."

      - name: Publicar versión con número (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
