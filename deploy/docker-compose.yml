# Calculadora solar detrás del Traefik existente (mismo patrón que las demás apps del servidor).
# Uso en la VPS:  cd /opt/calculadora-solar/deploy && docker compose up -d
# Actualizar:     cd /opt/calculadora-solar && git pull && docker compose -f deploy/docker-compose.yml restart
name: calculadora-solar
services:
  web:
    image: nginx:alpine
    container_name: calculadora-solar
    restart: unless-stopped
    volumes:
      - ../www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.calcsolar-https.redirectscheme.scheme=https
      - traefik.http.routers.calcsolar-http.entrypoints=web
      - traefik.http.routers.calcsolar-http.middlewares=calcsolar-https
      - traefik.http.routers.calcsolar-http.rule=Host(`${DOMINIO:-fotovcal.xcol.tech}`)
      - traefik.http.routers.calcsolar.entrypoints=websecure
      - traefik.http.routers.calcsolar.rule=Host(`${DOMINIO:-fotovcal.xcol.tech}`)
      - traefik.http.routers.calcsolar.tls=true
      - traefik.http.routers.calcsolar.tls.certresolver=letsencrypt
      - traefik.http.services.calcsolar.loadbalancer.server.port=80
